name: First Interaction

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
    branches: [source]

permissions:
  contents: read

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Welcome first-time contributors
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: Thanks for opening your first issue. A maintainer will review the reproduction and ownership boundary.
          pr_message: Thanks for your first pull request. Please confirm the target is `source` and include exact validation results.
