name: CI

on:
  workflow_dispatch:
    inputs:
      task:
        description: CI task to run.
        required: true
        type: choice
        default: ci
        options:
          - ci
          - codeql
          - stale
          - portable
          - package
      package-target:
        description: Package target for the package repair task.
        required: false
        type: choice
        default: windows-arm64
        options:
          - windows-arm64
          - windows-x64
          - linux-arm64
          - linux-x64
      source-sha:
        description: Optional source commit for the package repair task. Defaults to the dispatched ref.
        required: false
        type: string
        default: ''
      language:
        description: CodeQL language for the codeql task.
        required: false
        type: choice
        default: rust
        options:
          - rust
  pull_request:
    branches: [source]
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [source]
  issues:
    types: [opened]
  push:
    branches: [source]
  schedule:
    - cron: "37 7 * * 1"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repository-contracts:
    name: Repository Contracts
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.task == 'ci')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lune
        uses: ./.github/actions/setup-lune
      - name: Validate source branch
        uses: ./.github/actions/branches
        with:
          branch: ${{ github.event.pull_request.base.ref || github.ref_name }}
          kind: source
      - name: Validate repository shape
        run: lune run .github/scripts/source-checks.luau contracts

  rust:
    name: Rust (${{ matrix.os }})
    needs: repository-contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-wasip1
          components: rustfmt,clippy
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src/Cargo.toml --all --check
      - name: Check Rust lints
        run: cargo clippy --manifest-path src/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Test Rust
        run: cargo test --manifest-path src/Cargo.toml --all-targets --locked

  github-actions:
    name: GitHub Actions
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lune
        uses: ./.github/actions/setup-lune
      - name: Run shared automation checks
        run: lune run .github/scripts/source-checks.luau automation

  documentation:
    name: Documentation
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up groff
        run: sudo apt-get update && sudo apt-get install --yes groff
      - name: Check manpage
        run: groff -z -mandoc src/man/kero.1

  localization:
    name: Localization
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lune
        uses: ./.github/actions/setup-lune
      - name: Run shared localization checks
        run: lune run .github/scripts/source-checks.luau localization

  release-system:
    name: Release System
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lune
        uses: ./.github/actions/setup-lune
      - name: Run shared release-system checks
        run: lune run .github/scripts/source-checks.luau release

  build-pages:
    name: Build Pages
    needs: localization
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Pages tooling
        run: sudo apt-get update && sudo apt-get install --yes pandoc
      - name: Set up Lune
        uses: ./.github/actions/setup-lune
      - name: Build Pages
        uses: ./.github/actions/build-pages
        with:
          destination: ${{ runner.temp }}/kero-pages
      - name: Upload Pages validation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-pages
          path: ${{ runner.temp }}/kero-pages
      - name: Configure Pages
        if: github.event_name == 'push' && github.ref_name == 'source'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages deployment artifact
        if: github.event_name == 'push' && github.ref_name == 'source'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/kero-pages

  build-repository:
    name: Build Repository
    needs: [localization, release-system]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lune
        uses: ./.github/actions/setup-lune
      - name: Build generated repository
        uses: ./.github/actions/build-repo
        with:
          channel: canary
          destination: ${{ runner.temp }}/kero-repository
          version: unreleased
          source-commit: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload repository validation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-repository
          path: ${{ runner.temp }}/kero-repository

  documentation-links:
    name: Documentation Links
    needs: [build-pages, build-repository]
    runs-on: ubuntu-latest
    steps:
      - name: Download Pages artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-pages
          path: ${{ runner.temp }}/kero-pages
      - name: Download repository artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-repository
          path: ${{ runner.temp }}/kero-repository
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            github-token: ${{ github.token }}
            --no-progress --accept ..=204,429
            "${{ runner.temp }}/kero-repository/**/*.md"
            "${{ runner.temp }}/kero-pages/**/*.html"
          fail: false

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate dependency inputs
        run: test -f src/Cargo.lock && test -f .github/dependabot.yml
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0

  ci-gate:
    name: CI Gate
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.task == 'ci'))
    needs:
      - repository-contracts
      - rust
      - github-actions
      - documentation
      - localization
      - release-system
      - build-pages
      - build-repository
      - documentation-links
      - dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI jobs
        env:
          KERO_JOB_RESULTS: ${{ toJSON(needs) }}
          KERO_EVENT_NAME: ${{ github.event_name }}
        run: |
          failures="$(
            jq -r --arg event "$KERO_EVENT_NAME" '
              to_entries[]
              | select(
                  .value.result != "success"
                  and ((.key == "dependency-review" and $event != "pull_request" and .value.result == "skipped") | not)
                )
              | "\(.key): \(.value.result)"
            ' <<<"$KERO_JOB_RESULTS"
          )"
          if [ -n "$failures" ]; then
            echo "Required CI jobs did not succeed:"
            echo "$failures"
            exit 1
          fi
          echo "All required CI jobs succeeded"

  publication-decision:
    name: Publication Decision
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.task == 'ci'))
    needs: ci-gate
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
    steps:
      - id: policy
        env:
          CI_GATE_RESULT: ${{ needs.ci-gate.result }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          publish=false
          if [ "$CI_GATE_RESULT" = "success" ] && [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "source" ]; then publish=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  publication:
    name: Publication
    if: always() && needs.publication-decision.outputs.publish == 'true'
    needs: publication-decision
    permissions:
      actions: read
      contents: write
      checks: read
      pull-requests: read
    uses: ./.github/workflows/release.yml
    with:
      source-sha: ${{ github.sha }}


  pages-deploy:
    name: Pages
    if: github.event_name == 'push' && github.ref_name == 'source'
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  pull-request-labeler:
    name: Pull Request Labeler
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label changed paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  first-issue:
    name: First Interaction (Issue)
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Welcome first-time issue reporters
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: Thanks for opening your first issue. A maintainer will review the reproduction and ownership boundary.
          pr_message: unused

  first-pull-request:
    name: First Interaction (Pull Request)
    if: github.event_name == 'pull_request_target' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Welcome first-time pull-request contributors
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const priorPullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const hasPriorPullRequest = priorPullRequests.some((candidate) =>
              candidate.number < pullRequest.number
              && candidate.user?.login === pullRequest.user.login,
            );
            if (hasPriorPullRequest) {
              core.info(`Skipping welcome for ${pullRequest.user.login}; a prior pull request exists.`);
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              body: 'Thanks for your first pull request. Please confirm the target is `source` and include exact validation results.',
            });

  stale:
    name: Stale Discussions and Issues
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.task == 'stale')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Mark inactive work
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: pinned,security,roadmap
          exempt-pr-labels: pinned,security,release
          stale-issue-message: This issue has been inactive for 60 days. Add current evidence or context to keep it open.
          close-issue-message: Closing after the stale review window. It can be reopened when new evidence is available.
          stale-pr-message: This pull request has been inactive for 60 days. Rebase and add current validation when work resumes.
          close-pr-message: Closing after the stale review window. Open a new pull request from current `source` when work resumes.

  codeql:
    name: CodeQL
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'codeql'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      contents: read
    steps:
      - name: Require source workflow ref
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != "source" ]; then
            echo "CodeQL must be dispatched from source, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: source
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ inputs.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  portable:
    name: Local Distribution Portable Checks
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'portable'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lune
        uses: ./.github/actions/setup-lune
      - name: Run portable checks
        run: KERO_PORTABLE_WORKFLOW=1 lune run .github/scripts/distribution-portable.luau


  package-repair:
    name: Package Repair
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'package'
    permissions:
      actions: read
      contents: read
      checks: read
      pull-requests: read
    uses: ./.github/workflows/release.yml
    with:
      source-sha: ${{ inputs.source-sha || github.sha }}
      package-target: ${{ inputs.package-target }}
      publish: false
