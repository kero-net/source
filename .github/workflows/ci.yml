name: Validate

on:
  workflow_dispatch:
  pull_request:
    branches: [source]
  push:
    branches: [source]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repository:
    name: Repository Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate source branch
        uses: ./.github/actions/branches
        with:
          branch: ${{ github.event.pull_request.base.ref || github.ref_name }}
          kind: source

      - name: Set up repository tooling
        run: sudo apt-get update && sudo apt-get install --yes groff lua5.4 pandoc

      - name: Validate source
        uses: ./.github/actions/validate

      - name: Validate GitHub Actions
        run: lua5.4 .github/actions/validate/actionlint.lua

  links:
    name: Documentation Links
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --accept 200,429 "repo/templates/*.md" "pages/**/*.md" "i18n/**/*.md" ".github/**/*.md"
          fail: true
