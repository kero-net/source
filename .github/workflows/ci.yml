name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [source]
  push:
    branches: [source]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repository-contracts:
    name: Repository Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lua
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
      - name: Validate source branch
        uses: ./.github/actions/branches
        with:
          branch: ${{ github.event.pull_request.base.ref || github.ref_name }}
          kind: source
      - name: Validate repository shape
        run: KERO_LUA=lua5.4 lua5.4 .github/scripts/source-checks.lua contracts

  rust:
    name: Rust (${{ matrix.os }})
    needs: repository-contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lua: lua5.4
          - os: macos-latest
            lua: lua
          - os: windows-latest
            lua: lua
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WASM core target
        run: rustup target add wasm32-wasip1
      - name: Set up Lua
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
      - name: Set up Lua
        if: runner.os == 'macOS'
        run: brew install lua
      - name: Set up Lua
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install lua --yes --no-progress
      - name: Run shared Rust checks
        run: ${{ matrix.lua }} .github/scripts/source-checks.lua rust

  github-actions:
    name: GitHub Actions
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lua
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
      - name: Run shared automation checks
        run: KERO_LUA=lua5.4 KERO_LUAC=luac5.4 lua5.4 .github/scripts/source-checks.lua automation

  documentation:
    name: Documentation
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up groff
        run: sudo apt-get update && sudo apt-get install --yes groff lua5.4
      - name: Run shared documentation checks
        run: lua5.4 .github/scripts/source-checks.lua documentation

  localization:
    name: Localization
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lua
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
      - name: Run shared localization checks
        run: KERO_LUA=lua5.4 lua5.4 .github/scripts/source-checks.lua localization

  release-system:
    name: Release System
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lua
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
      - name: Run shared release-system checks
        run: KERO_LUA=lua5.4 lua5.4 .github/scripts/source-checks.lua release

  build-pages:
    name: Build Pages
    needs: localization
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Pages tooling
        run: sudo apt-get update && sudo apt-get install --yes lua5.4 pandoc
      - name: Build Pages
        uses: ./.github/actions/build-pages
        with:
          destination: ${{ runner.temp }}/kero-pages
      - name: Upload Pages validation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-pages
          path: ${{ runner.temp }}/kero-pages

  build-repository:
    name: Build Repository
    needs: [localization, release-system]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository tooling
        run: sudo apt-get update && sudo apt-get install --yes lua5.4 pandoc
      - name: Build generated repository
        uses: ./.github/actions/build-repo
        with:
          channel: canary
          destination: ${{ runner.temp }}/kero-repository
          version: unreleased
          source-commit: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload repository validation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-repository
          path: ${{ runner.temp }}/kero-repository

  documentation-links:
    name: Documentation Links
    needs: [build-pages, build-repository]
    runs-on: ubuntu-latest
    steps:
      - name: Download Pages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-pages
          path: ${{ runner.temp }}/kero-pages
      - name: Download repository artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-repository
          path: ${{ runner.temp }}/kero-repository
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            github-token: ${{ github.token }}
            --no-progress --accept ..=204,429
            "${{ runner.temp }}/kero-repository/**/*.md"
            "${{ runner.temp }}/kero-pages/**/*.html"
          fail: false

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lua
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
      - name: Validate dependency inputs
        run: lua5.4 .github/scripts/dependency-inputs.lua
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0

  packages:
    name: Package (${{ matrix.target }})
    needs: repository-contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-arm64
            os: windows-11-arm
            lua: lua
            qt-host: windows_arm64
            qt-arch: win64_msvc2022_arm64
            msvc-arch: arm64
          - target: windows-x64
            os: windows-latest
            lua: lua
            qt-host: windows
            qt-arch: win64_msvc2022_64
            msvc-arch: x64
          - target: linux-x64
            os: ubuntu-latest
            lua: lua5.4
            qt-host: linux
            qt-arch: gcc_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WASM core target
        run: rustup target add wasm32-wasip1
      - name: Set up Lua
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
        if: runner.os == 'Linux'
      - name: Set up Lua
        shell: pwsh
        run: choco install lua --yes --no-progress
        if: runner.os == 'Windows'
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.msvc-arch }}
      - name: Install Qt
        uses: jurplel/install-qt-action@3c4505ac6c534648cc14edb23c1eacf9c412498f # v4.2.0
        with:
          version: 6.8.*
          host: ${{ matrix.qt-host }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          cache: true
      - name: Configure Windows package environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "KERO_QT_PREFIX=$env:QT_ROOT_DIR" >> $env:GITHUB_ENV
          "KERO_CXX_COMPILER=cl.exe" >> $env:GITHUB_ENV
          if ('${{ matrix.target }}' -eq 'windows-arm64') {
            "KERO_MSVC_LINKER=$((Get-Command link.exe).Source)" >> $env:GITHUB_ENV
            "KERO_MSVC_ARCHIVER=$((Get-Command lib.exe).Source)" >> $env:GITHUB_ENV
          }
      - name: Install Linux AppImage tooling
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage --output "$RUNNER_TEMP/linuxdeploy"
          chmod 700 "$RUNNER_TEMP/linuxdeploy"
          echo "KERO_QT_PREFIX=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          echo "KERO_LINUXDEPLOY=$RUNNER_TEMP/linuxdeploy" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
      - name: Build unsigned package
        shell: bash
        run: ${{ matrix.lua }} distribution/scripts/package.lua "${{ matrix.target }}"
      - name: Upload unsigned package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}-unsigned
          path: .heap/build/releases/${{ matrix.target }}/
          if-no-files-found: error

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - repository-contracts
      - rust
      - github-actions
      - documentation
      - localization
      - release-system
      - build-pages
      - build-repository
      - documentation-links
      - dependency-review
      - packages
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI jobs
        env:
          KERO_JOB_RESULTS: ${{ toJSON(needs) }}
          KERO_EVENT_NAME: ${{ github.event_name }}
        run: |
          failures="$(
            jq -r --arg event "$KERO_EVENT_NAME" '
              to_entries[]
              | select(
                  .value.result != "success"
                  and ((.key == "dependency-review" and $event != "pull_request" and .value.result == "skipped") | not)
                )
              | "\(.key): \(.value.result)"
            ' <<<"$KERO_JOB_RESULTS"
          )"
          if [ -n "$failures" ]; then
            echo "Required CI jobs did not succeed:"
            echo "$failures"
            exit 1
          fi
          echo "All required CI jobs succeeded"

  publication-decision:
    name: Publication Decision
    if: always()
    needs: ci-gate
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
    steps:
      - id: policy
        env:
          CI_GATE_RESULT: ${{ needs.ci-gate.result }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          publish=false
          if [ "$CI_GATE_RESULT" = "success" ] && [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "source" ]; then publish=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  publication:
    name: Publication
    if: always() && needs.publication-decision.outputs.publish == 'true'
    needs: publication-decision
    permissions:
      actions: read
      contents: write
      checks: read
    uses: ./.github/workflows/release.yml
    with:
      source-sha: ${{ github.sha }}
