name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [source]
  push:
    branches: [source]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repository-contracts:
    name: Repository Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lune
        uses: ./.github/actions/setup-lune
      - name: Validate source branch
        uses: ./.github/actions/branches
        with:
          branch: ${{ github.event.pull_request.base.ref || github.ref_name }}
          kind: source
      - name: Validate repository shape
        run: lune run .github/scripts/source-checks.luau contracts

  rust:
    name: Rust (${{ matrix.os }})
    needs: repository-contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WASM core target
        run: rustup target add wasm32-wasip1
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src/Cargo.toml --all --check
      - name: Check Rust lints
        run: cargo clippy --manifest-path src/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Test Rust
        run: cargo test --manifest-path src/Cargo.toml --all-targets --locked

  github-actions:
    name: GitHub Actions
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lune
        uses: ./.github/actions/setup-lune
      - name: Run shared automation checks
        run: lune run .github/scripts/source-checks.luau automation

  documentation:
    name: Documentation
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up groff
        run: sudo apt-get update && sudo apt-get install --yes groff
      - name: Check manpage
        run: groff -z -mandoc src/man/kero.1

  localization:
    name: Localization
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lune
        uses: ./.github/actions/setup-lune
      - name: Run shared localization checks
        run: lune run .github/scripts/source-checks.luau localization

  release-system:
    name: Release System
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lune
        uses: ./.github/actions/setup-lune
      - name: Run shared release-system checks
        run: lune run .github/scripts/source-checks.luau release

  build-pages:
    name: Build Pages
    needs: localization
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Pages tooling
        run: sudo apt-get update && sudo apt-get install --yes pandoc
      - name: Set up Lune
        uses: ./.github/actions/setup-lune
      - name: Build Pages
        uses: ./.github/actions/build-pages
        with:
          destination: ${{ runner.temp }}/kero-pages
      - name: Upload Pages validation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-pages
          path: ${{ runner.temp }}/kero-pages

  build-repository:
    name: Build Repository
    needs: [localization, release-system]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lune
        uses: ./.github/actions/setup-lune
      - name: Build generated repository
        uses: ./.github/actions/build-repo
        with:
          channel: canary
          destination: ${{ runner.temp }}/kero-repository
          version: unreleased
          source-commit: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload repository validation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-repository
          path: ${{ runner.temp }}/kero-repository

  documentation-links:
    name: Documentation Links
    needs: [build-pages, build-repository]
    runs-on: ubuntu-latest
    steps:
      - name: Download Pages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-pages
          path: ${{ runner.temp }}/kero-pages
      - name: Download repository artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-repository
          path: ${{ runner.temp }}/kero-repository
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            github-token: ${{ github.token }}
            --no-progress --accept ..=204,429
            "${{ runner.temp }}/kero-repository/**/*.md"
            "${{ runner.temp }}/kero-pages/**/*.html"
          fail: false

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    needs: repository-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate dependency inputs
        run: test -f src/Cargo.lock && test -f .github/dependabot.yml
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - repository-contracts
      - rust
      - github-actions
      - documentation
      - localization
      - release-system
      - build-pages
      - build-repository
      - documentation-links
      - dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI jobs
        env:
          KERO_JOB_RESULTS: ${{ toJSON(needs) }}
          KERO_EVENT_NAME: ${{ github.event_name }}
        run: |
          failures="$(
            jq -r --arg event "$KERO_EVENT_NAME" '
              to_entries[]
              | select(
                  .value.result != "success"
                  and ((.key == "dependency-review" and $event != "pull_request" and .value.result == "skipped") | not)
                )
              | "\(.key): \(.value.result)"
            ' <<<"$KERO_JOB_RESULTS"
          )"
          if [ -n "$failures" ]; then
            echo "Required CI jobs did not succeed:"
            echo "$failures"
            exit 1
          fi
          echo "All required CI jobs succeeded"

  publication-decision:
    name: Publication Decision
    if: always()
    needs: ci-gate
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
    steps:
      - id: policy
        env:
          CI_GATE_RESULT: ${{ needs.ci-gate.result }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          publish=false
          if [ "$CI_GATE_RESULT" = "success" ] && [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "source" ]; then publish=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  publication:
    name: Publication
    if: always() && needs.publication-decision.outputs.publish == 'true'
    needs: publication-decision
    permissions:
      actions: read
      contents: write
      checks: read
    uses: ./.github/workflows/release.yml
    with:
      source-sha: ${{ github.sha }}
