name: Publication

on:
  workflow_call:
    inputs:
      source-sha:
        description: Validated source commit to publish.
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: publish-source
  cancel-in-progress: false

jobs:
  resolve-publication:
    name: Resolve Publication
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.publication.outputs.enabled }}
      record: ${{ steps.publication.outputs.record }}
      tag: ${{ steps.publication.outputs.tag }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Set up Lune
        uses: ./.github/actions/setup-lune
      - name: Resolve authored publication record
        id: publication
        run: lune run .github/scripts/publication.luau

  build-publications:
    name: Build ${{ matrix.channel }} publication
    needs: resolve-publication
    if: needs.resolve-publication.outputs.enabled == 'true'
    strategy:
      matrix:
        channel: [canary, beta, stable]
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Set up Lune
        uses: ./.github/actions/setup-lune
      - name: Build generated repository
        uses: ./.github/actions/build-repo
        with:
          channel: ${{ matrix.channel }}
          destination: ${{ runner.temp }}/kero-publication
          version: ${{ needs.resolve-publication.outputs.record }}
          source-commit: ${{ inputs.source-sha }}
      - name: Upload publication artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-${{ matrix.channel }}
          path: ${{ runner.temp }}/kero-publication
          if-no-files-found: error
          include-hidden-files: true

  validate-release-key:
    name: Validate Optional Release Key
    needs: resolve-publication
    if: needs.resolve-publication.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: release
    outputs:
      signing: ${{ steps.key.outputs.signing }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Set up GPG
        run: sudo apt-get update && sudo apt-get install --yes gnupg
      - name: Set up Lune
        uses: ./.github/actions/setup-lune
      - name: Import optional release key
        id: key
        env:
          KERO_GPG_KEY_ID: ${{ vars.KERO_GPG_KEY_ID }}
          KERO_GPG_PRIVATE_KEY: ${{ secrets.KERO_GPG_PRIVATE_KEY }}
          KERO_GPG_PASSPHRASE: ${{ secrets.KERO_GPG_PASSPHRASE }}
        run: |
          if [ -z "$KERO_GPG_PRIVATE_KEY" ] && [ -z "$KERO_GPG_PASSPHRASE" ]; then
            echo 'signing=false' >> "$GITHUB_OUTPUT"
            echo 'No private release key configured; publication will be unsigned.'
          else
            test -n "$KERO_GPG_KEY_ID" && test -n "$KERO_GPG_PRIVATE_KEY" && test -n "$KERO_GPG_PASSPHRASE"
            printf '%s' "$KERO_GPG_PRIVATE_KEY" | gpg --batch --import
            echo 'signing=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate optional release key
        if: steps.key.outputs.signing == 'true'
        env:
          KERO_GPG_KEY_ID: ${{ vars.KERO_GPG_KEY_ID }}
        run: lune run .github/scripts/distribution-signing-key.luau

  package-plan:
    name: Package Plan
    needs: resolve-publication
    if: needs.resolve-publication.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      self-hosted-allowed: ${{ steps.runner-policy.outputs.allowed }}
      self-hosted-target: windows-arm64
      self-hosted-labels: ${{ steps.runner-policy.outputs.labels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-lune
      - name: Resolve associated pull request authors
        id: pr-context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          authors="$(gh api             -H 'Accept: application/vnd.github+json'             "/repos/$GITHUB_REPOSITORY/commits/${{ inputs.source-sha }}/pulls"             --jq '[.[].user.login] | unique | join(",")' 2>/dev/null || true)"
          echo "authors=$authors" >> "$GITHUB_OUTPUT"
      - name: Resolve self-hosted runner policy
        id: runner-policy
        env:
          KERO_SELF_HOSTED_WORKFLOW: publication
          KERO_SELF_HOSTED_TARGET: windows-arm64
          KERO_TRIGGER_ACTOR: ${{ github.triggering_actor }}
          KERO_PR_AUTHORS: ${{ steps.pr-context.outputs.authors }}
        run: lune run .github/scripts/self-hosted-runner.luau
      - id: plan
        run: |
          set -o pipefail
          matrix="$(lune run .github/scripts/distribution-matrix.luau | tail -n 1)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-wasm:
    name: Build shared WASM core
    needs: resolve-publication
    if: needs.resolve-publication.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Install WASM core target
        run: rustup target add wasm32-wasip1
      - name: Build shared WASM core
        shell: bash
        run: |
          mkdir -p .heap/build/cargo/wasm
          CARGO_TARGET_DIR="$PWD/.heap/build/cargo/wasm" \
            cargo build --manifest-path src/Cargo.toml --release -p kero-core --target wasm32-wasip1
      - name: Upload shared WASM core
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-wasm-core
          path: .heap/build/cargo/wasm/wasm32-wasip1/release/kero_core.wasm
          if-no-files-found: error

  build-release-packages:
    name: Build package (${{ matrix.target }})
    needs: [resolve-publication, validate-release-key, package-plan, build-wasm]
    if: needs.resolve-publication.outputs.enabled == 'true'
    environment: release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package-plan.outputs.matrix) }}
    runs-on: ${{ matrix.target == needs.package-plan.outputs.self-hosted-target && needs.package-plan.outputs.self-hosted-allowed == 'true' && fromJSON(needs.package-plan.outputs.self-hosted-labels) || matrix.os }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Download shared WASM core
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-wasm-core
          path: .heap/build/cargo/wasm/wasm32-wasip1/release
      - name: Set up GPG
        if: runner.os == 'Linux' && needs.validate-release-key.outputs.signing == 'true'
        run: sudo apt-get update && sudo apt-get install --yes gnupg
      - name: Set up GPG
        if: runner.os == 'Windows' && needs.validate-release-key.outputs.signing == 'true'
        shell: cmd
        run: choco install gnupg --yes --no-progress
      - name: Install WASM core target
        run: rustup target add wasm32-wasip1
      - name: Set up Lune
        uses: ./.github/actions/setup-lune
      - name: Set up MSVC
        if: matrix.builder_kind == 'windows-msvc'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Set up x64 Python for ARM64 Qt extraction
        if: matrix.target == 'windows-arm64'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@3c4505ac6c534648cc14edb23c1eacf9c412498f # v4.2.0
        with:
          version: ${{ matrix.qt_version }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true
          setup-python: ${{ matrix.target != 'windows-arm64' }}
      - name: Configure MSVC package environment
        if: matrix.builder_kind == 'windows-msvc'
        shell: bash
        run: |
          compiler="$(where.exe cl.exe | head -n 1 | tr -d '\r')"
          linker="$(where.exe link.exe | head -n 1 | tr -d '\r')"
          archiver="$(where.exe lib.exe | head -n 1 | tr -d '\r')"
          rc="$(where.exe rc.exe | head -n 1 | tr -d '\r')"
          mt="$(where.exe mt.exe | head -n 1 | tr -d '\r')"
          compiler="$(cygpath -m "$compiler")"
          linker="$(cygpath -m "$linker")"
          archiver="$(cygpath -m "$archiver")"
          rc="$(cygpath -m "$rc")"
          mt="$(cygpath -m "$mt")"
          {
            echo "KERO_QT_PREFIX=$(cygpath -m "$QT_ROOT_DIR")"
            echo "KERO_CXX_COMPILER=$compiler"
            echo "KERO_MSVC_LINKER=$linker"
            echo "KERO_MSVC_LINKER_POSIX=$linker"
            echo "KERO_MSVC_ARCHIVER=$archiver"
            echo "KERO_MSVC_RC=$rc"
            echo "KERO_MSVC_MT=$mt"
            echo "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=$linker"
          } >> "$GITHUB_ENV"
      - name: Install hosted LLVM-MinGW toolchain
        if: matrix.builder_kind == 'windows-llvm'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/${{ matrix.llvm_mingw_archive }}"
          root="$RUNNER_TEMP/llvm-mingw-${{ matrix.llvm_mingw_version }}-ucrt-x86_64"
          curl --fail --location --retry 3 \
            "${{ matrix.llvm_mingw_base_url }}/${{ matrix.llvm_mingw_archive }}" \
            --output "$archive"
          echo "${{ matrix.llvm_mingw_sha256 }}  $archive" | sha256sum --check
          rm -rf "$root"
          unzip -q "$archive" -d "$RUNNER_TEMP"
          bin="$root/bin"
          qt="$(cygpath -m "$QT_ROOT_DIR")"
          {
            echo "KERO_QT_PREFIX=$qt"
            echo "KERO_CXX_COMPILER=$(cygpath -m "$bin/x86_64-w64-mingw32-clang++.exe")"
            echo "KERO_WINDRES=$(cygpath -m "$bin/x86_64-w64-mingw32-windres.exe")"
            echo "KERO_RUNTIME_DIR=$(cygpath -m "$root/x86_64-w64-mingw32/bin")"
            echo "KERO_DEPLOY_TOOL=$qt/bin/windeployqt.exe"
            echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER=$(cygpath -m "$bin/x86_64-w64-mingw32-clang.exe")"
          } >> "$GITHUB_ENV"
          cygpath -w "$bin" >> "$GITHUB_PATH"
      - name: Install Linux AppImage tooling
        if: matrix.builder_kind == 'wsl-linux'
        shell: bash
        run: |
          deploy="$RUNNER_TEMP/linuxdeploy"
          runtime="$RUNNER_TEMP/appimage-runtime"
          icon="$RUNNER_TEMP/kero.png"
          curl --fail --location --retry 3 \
            "${{ matrix.linuxdeploy_base_url }}/linuxdeploy-${{ matrix.linuxdeploy_arch }}.AppImage" \
            --output "$deploy"
          echo "${{ matrix.linuxdeploy_sha256 }}  $deploy" | sha256sum --check
          curl --fail --location --retry 3 \
            "${{ matrix.appimage_runtime_base_url }}/runtime-${{ matrix.linuxdeploy_arch }}" \
            --output "$runtime"
          echo "${{ matrix.appimage_runtime_sha256 }}  $runtime" | sha256sum --check
          chmod 700 "$deploy" "$runtime"
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes imagemagick
          fi
          convert assets/images/kero-icon.png -resize 512x512! "$icon"
          {
            echo "KERO_QT_PREFIX=$QT_ROOT_DIR"
            echo "KERO_LINUXDEPLOY=$deploy"
            echo "KERO_DEPLOY_TOOL=$deploy"
            echo "KERO_APPIMAGE_RUNTIME=$runtime"
            echo "KERO_LINUX_ARCH=${{ matrix.linuxdeploy_arch }}"
            echo "KERO_LINUX_ICON=$icon"
            echo "APPIMAGE_EXTRACT_AND_RUN=1"
          } >> "$GITHUB_ENV"
          if [[ '${{ matrix.target }}' == 'linux-x64' ]]; then
            {
              echo "KERO_C_COMPILER=gcc"
              echo "KERO_CXX_COMPILER=g++"
            } >> "$GITHUB_ENV"
          fi
      - name: Configure protected release signing
        if: needs.validate-release-key.outputs.signing == 'true'
        shell: bash
        env:
          KERO_GPG_KEY_ID: ${{ vars.KERO_GPG_KEY_ID }}
          KERO_GPG_PRIVATE_KEY: ${{ secrets.KERO_GPG_PRIVATE_KEY }}
          KERO_GPG_PASSPHRASE: ${{ secrets.KERO_GPG_PASSPHRASE }}
        run: |
          test -n "$KERO_GPG_KEY_ID"
          test -n "$KERO_GPG_PRIVATE_KEY"
          test -n "$KERO_GPG_PASSPHRASE"
          printf '%s' "$KERO_GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s\n' '#!/usr/bin/env bash' "exec gpg --batch --yes --pinentry-mode loopback --passphrase \"\$KERO_GPG_PASSPHRASE\" \"\$@\"" > "$RUNNER_TEMP/kero-gpg"
          chmod 700 "$RUNNER_TEMP/kero-gpg"
          {
            echo "KERO_SIGN_RELEASE=1"
            echo "KERO_GPG_KEY_ID=$KERO_GPG_KEY_ID"
            echo "KERO_GPG_COMMAND=$RUNNER_TEMP/kero-gpg"
          } >> "$GITHUB_ENV"
      - name: Build package
        env:
          KERO_BUILD_TARGET: ${{ matrix.target }}
        shell: bash
        run: lune run .github/scripts/distribution-package.luau
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: .heap/build/releases/${{ matrix.target }}/
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.channel }}
    needs: [resolve-publication, validate-release-key, build-publications, build-release-packages]
    if: needs.resolve-publication.outputs.enabled == 'true'
    strategy:
      max-parallel: 1
      matrix:
        channel: [canary, beta, stable]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Set up publication tooling
        uses: ./.github/actions/setup-lune
      - name: Download publication artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publication-${{ matrix.channel }}
          path: ${{ runner.temp }}/kero-publication
      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: ${{ runner.temp }}/kero-packages
          merge-multiple: true
      - name: Create organization publication token
        id: publisher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.0.0
        with:
          client-id: ${{ vars.KERO_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.KERO_RELEASE_APP_PRIVATE_KEY }}
          owner: kero-net
          repositories: kero
          permission-contents: write
          permission-administration: write
      - name: Configure publication identity
        run: |
          git config --global user.name "KERO Release System"
          git config --global user.email "129922068+Kooraseru@users.noreply.github.com"
      - name: Configure release signing
        if: needs.validate-release-key.outputs.signing == 'true'
        env:
          KERO_GPG_KEY_ID: ${{ vars.KERO_GPG_KEY_ID }}
          KERO_GPG_VERIFICATION_KEYS: ${{ vars.KERO_GPG_VERIFICATION_KEYS }}
          KERO_GPG_PRIVATE_KEY: ${{ secrets.KERO_GPG_PRIVATE_KEY }}
          KERO_GPG_PASSPHRASE: ${{ secrets.KERO_GPG_PASSPHRASE }}
        run: |
          printf '%s' "$KERO_GPG_VERIFICATION_KEYS" | gpg --batch --import
          printf '%s' "$KERO_GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="${KERO_GPG_KEY_ID#0x}"
          test "$(gpg --batch --with-colons --list-secret-keys "$fingerprint" | awk -F: '$1 == "fpr" { print toupper($10); exit }')" = "$fingerprint"
          printf '%s\n' '#!/usr/bin/env bash' "exec gpg --batch --yes --pinentry-mode loopback --passphrase \"\$KERO_GPG_PASSPHRASE\" \"\$@\"" > "$RUNNER_TEMP/gpg-wrapper"
          chmod 700 "$RUNNER_TEMP/gpg-wrapper"
          git config --global user.name "KERO Release System"
          git config --global user.email "129922068+Kooraseru@users.noreply.github.com"
          git config --global user.signingkey "$fingerprint"
          git config --global gpg.program "$RUNNER_TEMP/gpg-wrapper"
          git config --global commit.gpgsign true
          git config --global tag.gpgSign true
          echo 'KERO_SIGN_RELEASE=1' >> "$GITHUB_ENV"
      - name: Publish generated repository
        uses: ./.github/actions/publish
        env:
          KERO_RELEASE_TOKEN: ${{ steps.publisher.outputs.token }}
          KERO_GPG_PASSPHRASE: ${{ secrets.KERO_GPG_PASSPHRASE }}
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        with:
          channel: ${{ matrix.channel }}
          version: ${{ needs.resolve-publication.outputs.record }}
          source-commit: ${{ inputs.source-sha }}
          payload: ${{ runner.temp }}/kero-publication
          packages: ${{ runner.temp }}/kero-packages
