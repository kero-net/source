name: Publication

on:
  workflow_call:
    inputs:
      source-sha:
        description: Validated source commit to publish.
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: publish-source
  cancel-in-progress: false

jobs:
  resolve-publication:
    name: Resolve Publication
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.publication.outputs.enabled }}
      record: ${{ steps.publication.outputs.record }}
      tag: ${{ steps.publication.outputs.tag }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Set up Lua
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
      - name: Resolve authored publication record
        id: publication
        run: lua5.4 .github/scripts/publication.lua

  build-publications:
    name: Build ${{ matrix.channel }} publication
    needs: resolve-publication
    if: needs.resolve-publication.outputs.enabled == 'true'
    strategy:
      matrix:
        channel: [canary, beta, stable]
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Set up repository tooling
        run: sudo apt-get update && sudo apt-get install --yes lua5.4 pandoc
      - name: Build generated repository
        uses: ./.github/actions/build-repo
        with:
          channel: ${{ matrix.channel }}
          destination: ${{ runner.temp }}/kero-publication
          version: ${{ needs.resolve-publication.outputs.record }}
          source-commit: ${{ inputs.source-sha }}
      - name: Upload publication artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-${{ matrix.channel }}
          path: ${{ runner.temp }}/kero-publication
          if-no-files-found: error
          include-hidden-files: true

  validate-release-key:
    name: Validate Optional Release Key
    needs: resolve-publication
    if: needs.resolve-publication.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Set up Lua and GPG
        run: sudo apt-get update && sudo apt-get install --yes lua5.4 gnupg
      - name: Import optional release key
        env:
          KERO_GPG_PRIVATE_KEY: ${{ secrets.KERO_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$KERO_GPG_PRIVATE_KEY" ]; then
            printf '%s' "$KERO_GPG_PRIVATE_KEY" | gpg --batch --import
          fi
      - name: Validate optional release key
        env:
          KERO_GPG_KEY_ID: ${{ vars.KERO_GPG_KEY_ID }}
        run: lua5.4 distribution/scripts/validate-key.lua

  publish:
    name: Publish ${{ matrix.channel }}
    needs: [resolve-publication, build-publications]
    if: needs.resolve-publication.outputs.enabled == 'true'
    strategy:
      max-parallel: 1
      matrix:
        channel: [canary, beta, stable]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Set up publication tooling
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
      - name: Download publication artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publication-${{ matrix.channel }}
          path: ${{ runner.temp }}/kero-publication
      - name: Create organization publication token
        id: publisher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.0.0
        with:
          client-id: ${{ vars.KERO_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.KERO_RELEASE_APP_PRIVATE_KEY }}
          owner: kero-net
          repositories: kero
          permission-contents: write
          permission-administration: write
      - name: Configure release signing
        env:
          KERO_GPG_KEY_ID: ${{ vars.KERO_GPG_KEY_ID }}
          KERO_GPG_VERIFICATION_KEYS: ${{ vars.KERO_GPG_VERIFICATION_KEYS }}
          KERO_GPG_PRIVATE_KEY: ${{ secrets.KERO_GPG_PRIVATE_KEY }}
          KERO_GPG_PASSPHRASE: ${{ secrets.KERO_GPG_PASSPHRASE }}
        run: |
          printf '%s' "$KERO_GPG_VERIFICATION_KEYS" | gpg --batch --import
          printf '%s' "$KERO_GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="${KERO_GPG_KEY_ID#0x}"
          test "$(gpg --batch --with-colons --list-secret-keys "$fingerprint" | awk -F: '$1 == "fpr" { print toupper($10); exit }')" = "$fingerprint"
          printf '%s\n' '#!/usr/bin/env bash' "exec gpg --batch --yes --pinentry-mode loopback --passphrase \"\$KERO_GPG_PASSPHRASE\" \"\$@\"" > "$RUNNER_TEMP/gpg-wrapper"
          chmod 700 "$RUNNER_TEMP/gpg-wrapper"
          git config --global user.name "KERO Release System"
          git config --global user.email "129922068+Kooraseru@users.noreply.github.com"
          git config --global user.signingkey "$fingerprint"
          git config --global gpg.program "$RUNNER_TEMP/gpg-wrapper"
          git config --global commit.gpgsign true
          git config --global tag.gpgSign true
      - name: Publish generated repository
        uses: ./.github/actions/publish
        env:
          KERO_RELEASE_TOKEN: ${{ steps.publisher.outputs.token }}
          KERO_GPG_PASSPHRASE: ${{ secrets.KERO_GPG_PASSPHRASE }}
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        with:
          channel: ${{ matrix.channel }}
          version: ${{ needs.resolve-publication.outputs.record }}
          source-commit: ${{ inputs.source-sha }}
          payload: ${{ runner.temp }}/kero-publication
