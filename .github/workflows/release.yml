name: Publish

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Generated public branch to replace.
        required: true
        type: choice
        options: [canary, beta, stable]
      version:
        description: Authored release to publish.
        required: true
        type: choice
        options:
          - 2026.08.1-regular

permissions:
  contents: read

concurrency:
  group: publish-release-stream
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.channel }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up release tooling
        run: sudo apt-get update && sudo apt-get install --yes groff lua5.4 pandoc

      - name: Validate source branch
        uses: ./.github/actions/branches
        with:
          branch: ${{ github.ref_name }}
          kind: source

      - name: Validate publication channel
        uses: ./.github/actions/branches
        with:
          branch: ${{ inputs.channel }}
          kind: channel

      - name: Validate source
        uses: ./.github/actions/validate

      - name: Validate release
        id: release
        uses: ./.github/actions/release
        with:
          version: ${{ inputs.version }}

      - name: Resolve immutable source commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build generated repository
        uses: ./.github/actions/build-repo
        with:
          channel: ${{ inputs.channel }}
          destination: ${{ runner.temp }}/kero-publication
          version: ${{ inputs.version }}
          source-commit: ${{ steps.source.outputs.commit }}

      # Keep signing setup explicit until the GPG identity model is reviewed independently.
      - name: Configure release signing
        shell: bash
        env:
          PERSONAL_SIGNING_KEY: ${{ secrets.PERSONAL_SIGNING_KEY }}
          PERSONAL_SIGNING_PASSPHRASE: ${{ secrets.PERSONAL_SIGNING_PASSPHRASE }}
          RELEASE_SIGNING_NAME: ${{ vars.RELEASE_SIGNING_NAME }}
          RELEASE_SIGNING_EMAIL: ${{ vars.RELEASE_SIGNING_EMAIL }}
        run: |
          for name in PERSONAL_SIGNING_KEY RELEASE_SIGNING_NAME RELEASE_SIGNING_EMAIL; do
            if [ -z "${!name:-}" ]; then
              echo "Missing protected release value: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$PERSONAL_SIGNING_KEY" | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [ -z "$fingerprint" ]; then
            echo "Imported release key has no secret-key fingerprint" >&2
            exit 1
          fi
          wrapper="$RUNNER_TEMP/gpg-wrapper"
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'args=(--batch --yes --pinentry-mode loopback)' \
            'if [ -n "${PERSONAL_SIGNING_PASSPHRASE:-}" ]; then args+=(--passphrase "$PERSONAL_SIGNING_PASSPHRASE"); fi' \
            'exec gpg "${args[@]}" "$@"' > "$wrapper"
          chmod 700 "$wrapper"
          git config --global user.name "$RELEASE_SIGNING_NAME"
          git config --global user.email "$RELEASE_SIGNING_EMAIL"
          git config --global user.signingkey "$fingerprint"
          git config --global gpg.program "$wrapper"
          git config --global commit.gpgsign true
          git config --global tag.gpgSign true

      - name: Publish generated repository
        uses: ./.github/actions/publish
        env:
          PERSONAL_RELEASE_TOKEN: ${{ secrets.PERSONAL_RELEASE_TOKEN }}
          PERSONAL_SIGNING_PASSPHRASE: ${{ secrets.PERSONAL_SIGNING_PASSPHRASE }}
          GH_TOKEN: ${{ secrets.PERSONAL_RELEASE_TOKEN }}
        with:
          channel: ${{ inputs.channel }}
          version: ${{ inputs.version }}
          source-commit: ${{ steps.source.outputs.commit }}
          payload: ${{ runner.temp }}/kero-publication

  refresh-pages:
    name: Refresh Pages
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch source-owned Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref source
