name: Visit Counter

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visit-counter
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Require supported branch
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            source|stable) ;;
            *) echo "Visit Counter must run from source or stable, got $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Restore history
        shell: bash
        run: |
          mkdir -p .visit-counter
          git fetch origin visit-counter:refs/remotes/origin/visit-counter || true
          if git show-ref --verify --quiet refs/remotes/origin/visit-counter; then
            git show origin/visit-counter:history.json > .visit-counter/history.json
          else
            printf '{}\n' > .visit-counter/history.json
          fi

      - name: Generate counter
        uses: ./src
        with:
          token: ${{ secrets.PERSONAL_RELEASE_TOKEN }}

      - name: Publish counter
        shell: bash
        run: |
          publish_dir="${RUNNER_TEMP}/visit-counter-publish"
          if git show-ref --verify --quiet refs/remotes/origin/visit-counter; then
            git worktree add -B visit-counter "$publish_dir" origin/visit-counter
          else
            git worktree add --detach "$publish_dir"
            git -C "$publish_dir" switch --orphan visit-counter
            git -C "$publish_dir" rm -rf .
          fi
          cp .visit-counter/output/history.json "$publish_dir/history.json"
          cp .visit-counter/output/views.svg "$publish_dir/views.svg"
          git -C "$publish_dir" add --all
          if git -C "$publish_dir" diff --cached --quiet; then
            exit 0
          fi
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" commit -m "Update repository visit counter"
          git -C "$publish_dir" push origin HEAD:visit-counter
