version: 2
updates:
  - package-ecosystem: cargo
    directory: /code
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
