name: Set up pinned Rust
description: Install the pinned Rust toolchain and requested targets/components for any runner.
inputs:
  targets:
    description: Comma-separated rustup targets to install.
    required: false
    default: ''
  components:
    description: Comma-separated rustup components to install.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      if: runner.os != 'Windows'
      uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a # 1.95.0
      with:
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
    - name: Install Rust toolchain on Windows
      if: runner.os == 'Windows'
      shell: powershell
      env:
        KERO_RUST_TARGETS: ${{ inputs.targets }}
        KERO_RUST_COMPONENTS: ${{ inputs.components }}
      run: '& "$env:GITHUB_ACTION_PATH/../../../distribution/actions/install-rust-windows.ps1"'
