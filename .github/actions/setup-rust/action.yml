name: Set up pinned Rust
description: Install the pinned Rust toolchain and requested targets/components for any runner.
inputs:
  targets:
    description: Comma-separated rustup targets to install.
    required: false
    default: ''
  components:
    description: Comma-separated rustup components to install.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      with:
        toolchain: 1.95.0
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
