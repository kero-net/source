name: Set up pinned Lune
description: Install the verified prebuilt Lune runtime for this runner.
runs:
  using: composite
  steps:
    - name: Install Lune
      if: runner.os != 'Windows'
      shell: bash
      env:
        KERO_LUNE_OS: ${{ runner.os }}
      run: |
        bash "$GITHUB_ACTION_PATH/../../../distribution/actions/install-lune.sh" "$RUNNER_TEMP/kero-lune"
        echo "$RUNNER_TEMP/kero-lune" >> "$GITHUB_PATH"
    - name: Install Lune on Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: '& "$env:GITHUB_ACTION_PATH/../../../distribution/actions/install-lune-windows.ps1"'
