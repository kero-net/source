schema = "terminal-policy/environment/v1"
environment_id = "environment.scope-development"
context_providers = ["branch", "environment", "project", "revocation", "time"]

[[sources]]
id = "source.scope-development"
kind = "project-policy"
locator = "records.toml"
trust_mode = "origin"
record_actions = [
  "principal.define",
  "role.define",
  "role.assign",
  "statement.allow",
  "statement.deny",
  "delegation.issue",
]
operations = ["*"]
scope_universe = ["branch", "command", "environment", "knowledge", "path", "repository", "service"]
