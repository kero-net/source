[features.heading.values]
en-US = "Features"
ja-JP = "機能"
[features.independent_results.values]
en-US = "Keeps authorization, artifact verification, runtime capability, enforcement, and execution as separate results."
ja-JP = "認可、成果物検証、実行能力、強制適用、実行結果を別々に扱います。"
[features.immutable_artifacts.values]
en-US = "Verifies immutable and replayable Layer 2 decision artifacts without re-deciding policy."
ja-JP = "ポリシーを再判断せず、不変で再現可能な Layer 2 判断成果物を検証します。"
[features.linux_boundaries.values]
en-US = "Targets explicit Linux enforcement boundaries with auditable threat models."
ja-JP = "監査可能な脅威モデルを備えた明示的な Linux 強制境界を対象とします。"
[features.rust_backend.values]
en-US = "Uses a low-overhead Rust backend; optional web tooling remains outside the trusted enforcement core."
ja-JP = "低負荷な Rust バックエンドを使用し、任意の Web ツールを信頼された強制適用コアから分離します。"

[quick_start.heading.values]
en-US = "Quick Start"
ja-JP = "クイックスタート"
[quick_start.build_cli.heading.values]
en-US = "1. Build the current CLI"
ja-JP = "1. 現在の CLI をビルドする"
[quick_start.build_cli.platform_support.values]
en-US = "KERO currently targets Linux. Windows binaries and Flatpak packaging are planned for later; build from source on Ubuntu, Debian, or Arch for now."
ja-JP = "現在 KERO は Linux を対象としています。Windows バイナリと Flatpak パッケージは今後追加する予定です。現時点では Ubuntu、Debian、または Arch でソースからビルドしてください。"
[quick_start.build_cli.prerequisites_intro.values]
en-US = "Install Rust and the native build tools first:"
ja-JP = "Rust とネイティブビルドツールを最初にインストールします。"
[quick_start.build_cli.build_intro.values]
en-US = "Run the Rust commands from the repository's src directory:"
ja-JP = "リポジトリの src ディレクトリで Rust コマンドを実行します。"
[quick_start.build_cli.path_note.values]
en-US = "Ensure HOME/.local/bin is on PATH. On Fish, use the absolute /usr/bin/install because some systems define install as a package-manager function."
ja-JP = "HOME/.local/bin が PATH に含まれていることを確認します。Fish では、一部の環境で install がパッケージマネージャー関数として定義されるため、絶対パスの /usr/bin/install を使ってください。"

[quick_start.global_environment.heading.values]
en-US = "2. Choose the global environment"
ja-JP = "2. グローバル環境を選択する"
[quick_start.global_environment.intro.values]
en-US = "Choose the global KERO environment once. HOME/.kero is the normal default; use --root when the data belongs elsewhere."
ja-JP = "グローバル KERO 環境を一度選択します。通常の既定値は HOME/.kero です。別の場所に保存する場合は --root を使います。"
[quick_start.global_environment.default_intro.values]
en-US = "Use the normal default:"
ja-JP = "通常の既定値を使用します。"
[quick_start.global_environment.custom_intro.values]
en-US = "Or choose another location explicitly:"
ja-JP = "または、別の場所を明示的に選択します。"
[quick_start.global_environment.storage_note.values]
en-US = "The selected location is recorded in machine-local XDG configuration and is never committed into repositories."
ja-JP = "選択した場所はマシンローカルの XDG 設定に記録され、リポジトリにはコミットされません。"

[quick_start.initialize_repository.heading.values]
en-US = "3. Initialize a repository"
ja-JP = "3. リポジトリを初期化する"
[quick_start.initialize_repository.layout_intro.values]
en-US = "KERO creates one top-level integration directory. Local knowledge and runtime state remain ignored."
ja-JP = "KERO が作成するトップレベルの統合ディレクトリは一つだけです。ローカル知識と実行時状態は無視されます。"

[quick_start.minimal_policy.heading.values]
en-US = "4. Define a minimal standalone policy"
ja-JP = "4. 最小のスタンドアロンポリシーを定義する"
[quick_start.minimal_policy.records_intro.values]
en-US = "The generated environment treats .kero/policy/records.toml as this repository's origin policy. Add a principal, role, statement, and assignment:"
ja-JP = "生成された環境では .kero/policy/records.toml をこのリポジトリの origin ポリシーとして扱います。principal、role、statement、assignment を追加します。"
[quick_start.minimal_policy.request_intro.values]
en-US = "Create .kero/tests/write-source.toml:"
ja-JP = ".kero/tests/write-source.toml を作成します。"
[quick_start.minimal_policy.authorize_intro.values]
en-US = "Resolve it using the .kero defaults:"
ja-JP = ".kero の既定値を使って解決します。"
[quick_start.minimal_policy.replay_intro.values]
en-US = "The command returns a pure ALLOW or DENY result and stores an immutable snapshot. Replay with the returned snapshot path and digest to prove the result no longer depends on mutable TOML:"
ja-JP = "コマンドは純粋な ALLOW または DENY を返し、不変スナップショットを保存します。返されたパスと digest で再実行し、結果が変更可能な TOML に依存しないことを確認します。"

[policy_model.heading.values]
en-US = "Shared Global and Project-Specific Policy"
ja-JP = "共有グローバルポリシーとプロジェクト固有ポリシー"
[policy_model.authority_intro.values]
en-US = "KERO does not merge files merely because one is called global and another is inside a repository. Authority comes from policy-source records in one environment."
ja-JP = "KERO は、ファイル名が global であることやリポジトリ内にあることだけを理由にポリシーを統合しません。権限は一つの環境に定義された policy source レコードから生じます。"
[policy_model.deny_precedence.values]
en-US = "An applicable explicit deny dominates applicable allows. Missing authority defaults to DENY; role names and session fields cannot manufacture authority."
ja-JP = "適用可能な明示的 deny は allow より優先されます。権限がなければ DENY となり、role 名や session フィールドから権限を作ることはできません。"
[policy_model.record_locations.values]
en-US = "Global records live under the selected global KERO environment, while project records remain under .kero/policy. Pass every record file explicitly."
ja-JP = "グローバルレコードは選択したグローバル KERO 環境に置き、プロジェクトレコードは .kero/policy に置きます。すべてのレコードファイルを明示的に渡します。"
[policy_model.trust_modes.values]
en-US = "Use origin for initial trusted authority, delegated for authority bounded by another source, and restrictive for policy that can only narrow inherited authority."
ja-JP = "最初の信頼された権限には origin、別の source に制限された権限には delegated、継承権限を狭めるだけのポリシーには restrictive を使います。"

[status.heading.values]
en-US = "Status"
ja-JP = "状態"
[status.channel_notice.values]
en-US = "KERO is distributed through canary, beta, and stable channels. An ENFORCED result applies only to its named boundary and threat model."
ja-JP = "KERO は canary、beta、stable チャネルで配布されます。ENFORCED は指定された境界と脅威モデルにのみ適用されます。"

[development.heading.values]
en-US = "Development"
ja-JP = "開発"
[development.consumer_setup.values]
en-US = "Run kero project init in a consumer repository to create its single .kero integration directory."
ja-JP = "利用するリポジトリで kero project init を実行すると、単一の .kero 統合ディレクトリが作成されます。"
[development.validation.values]
en-US = "Canonical development happens on source. Run the Rust tests from src and see CONTRIBUTING.md for the full validation workflow."
ja-JP = "正規の開発は source で行います。src から Rust テストを実行し、完全な検証手順は CONTRIBUTING.md を参照してください。"

[project.heading.values]
en-US = "Project"
ja-JP = "プロジェクト"
[project.branch_ownership.values]
en-US = "The source branch is canonical. Automation owns the generated canary, beta, and stable publication branches."
ja-JP = "source ブランチが正規です。生成される canary、beta、stable 公開ブランチは自動化によって管理されます。"

[project.repository_topology.values]
en-US = "The current source repository remains canonical until an organization migration is approved. The planned topology is one public repository at [tool-name] and a separate canonical source repository at [tool-name]/src; names, URLs, and ownership are release decisions and are not assumed here."
ja-JP = "組織移行が承認されるまでは、現在のソースリポジトリが正規です。計画上の構成は [tool-name] の公開リポジトリと [tool-name]/src の正規ソースリポジトリですが、名前、URL、所有権はリリース決定であり、ここでは仮定しません。"

[license.heading.values]
en-US = "License"
ja-JP = "ライセンス"
