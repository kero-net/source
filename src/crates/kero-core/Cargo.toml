[package]
name = "kero-core"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Portable core for KERO repository environments"
license = "ISC"
repository = "https://github.com/kero-net/kero"
keywords = ["knowledge", "provenance", "semantic", "retrieval"]
categories = ["data-structures", "development-tools"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ed25519-dalek = "2"
filetime = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tempfile = "3"
toml = "1.1"

[dev-dependencies]
