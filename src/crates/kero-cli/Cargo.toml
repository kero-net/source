[package]
name = "kero-cli"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Command-line adapter for KERO knowledge environments"
license = "ISC"
repository = "https://github.com/kero-net/kero"

[[bin]]
name = "kero"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
kero-core = { path = "../kero-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
