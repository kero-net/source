[package]
name = "scope-cli"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "SCOPE Controls Operations, Policy, and Environment"
license = "ISC"
repository = "https://github.com/Kooraseru/SCOPE"
keywords = ["authorization", "policy", "sandbox", "security", "linux"]
categories = ["command-line-utilities", "authentication"]

[[bin]]
name = "scope"
path = "rust/main.rs"

[lib]
name = "scope_cli"
path = "rust/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
