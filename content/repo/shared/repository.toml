[sections.development.title.values]
en-US = "Development"
ja-JP = "開発"
[sections.development.body.values]
en-US = '''Run `scope init` in a consumer repository to create its single `.scope/` integration directory. Canonical SCOPE development happens on `source`; run `cd src && cargo test --all-targets` for product tests. See [`CONTRIBUTING.md`](../CONTRIBUTING.md) for the full validation workflow.'''
ja-JP = '''利用するリポジトリで `scope init` を実行すると、単一の `.scope/` 統合ディレクトリが作成されます。SCOPE の正規開発は `source` で行い、製品テストは `cd src && cargo test --all-targets` で実行します。完全な検証手順は [`CONTRIBUTING.md`](../CONTRIBUTING.md) を参照してください。'''

