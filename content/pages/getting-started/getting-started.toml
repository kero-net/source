[title.values]
en-US = "Getting Started"
ja-JP = "はじめに"

[introduction.values]
en-US = "Initialize SCOPE from the root of a repository. SCOPE creates one integration directory and does not scatter configuration or runtime state across the project."
ja-JP = "リポジトリのルートで SCOPE を初期化します。SCOPE は統合用ディレクトリを一つだけ作成し、設定や実行時状態をプロジェクト全体に分散させません。"

[global.values]
en-US = "First choose a global environment. `$HOME/.scope` is the suggested default; pass `--root` to store it elsewhere. SCOPE records the selection in the machine-local XDG configuration."
ja-JP = "最初にグローバル環境を選択します。推奨される既定値は `$HOME/.scope` です。別の場所に保存するには `--root` を渡します。SCOPE は選択内容をマシンローカルの XDG 設定に記録します。"

[layout.values]
en-US = "All SCOPE-owned project knowledge, policy, checklists, tests, and state live beneath `.scope/`:"
ja-JP = "SCOPE が所有するプロジェクト知識、ポリシー、チェックリスト、テスト、状態はすべて `.scope/` の下に配置されます。"

[state.values]
en-US = "`.scope/state/` is ignored by `.scope/.gitignore`. It contains local snapshots, nonce admission state, audit data, and other runtime evidence; it must not be committed."
ja-JP = "`.scope/state/` は `.scope/.gitignore` により無視されます。ローカルスナップショット、nonce 管理状態、監査データなどの実行時証拠を格納し、コミットしてはいけません。"
