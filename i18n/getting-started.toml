[title.values]
en-US = "Getting Started"
ja-JP = "はじめに"

[introduction.values]
en-US = "KERO is a persistent knowledge environment attached to a project through a `.kero/` boundary."
ja-JP = "KERO は `.kero/` 境界を通じてプロジェクトに接続する永続的な知識環境です。"

[current_state.values]
en-US = "KERO is pre-alpha. Phase 1 provides the accepted architecture and a clean Rust foundation; project and compilation commands arrive in later phases."
ja-JP = "KERO はプレアルファです。Phase 1 では承認済みアーキテクチャとクリーンな Rust 基盤を提供し、プロジェクトおよびコンパイルコマンドは後続フェーズで追加されます。"

[project_model.values]
en-US = "The intended project model keeps reviewable source declarations small while KERO owns compiled and cached state. Users do not manually maintain an internal database tree."
ja-JP = "想定するプロジェクトモデルでは、レビュー可能な情報源宣言を小さく保ち、コンパイル済み状態とキャッシュ状態を KERO が管理します。利用者が内部データベースのツリーを手動管理する必要はありません。"

[future_flow.values]
en-US = "The planned normal workflow is simple even though the compiler maintains source revisions, provenance, semantic records, canonicalization, indexes, and projections internally:"
ja-JP = "コンパイラー内部では情報源リビジョン、来歴、セマンティックレコード、正規化、インデックス、投影を管理しますが、計画されている通常のワークフローはシンプルです。"
