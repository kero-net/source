[direction.heading.values]
en-US = "Knowledge-system direction"
ja-JP = "知識システムの方向性"
[direction.introduction.values]
en-US = "KERO groups heterogeneous information sources into structured machine knowledge while preserving their distinct identity and provenance. Humans manage sources; KERO manages compilation."
ja-JP = "KERO は異種の情報源を、個別の識別情報と来歴を保ったまま構造化された機械向け知識にまとめます。人間が情報源を管理し、KERO がコンパイルを管理します。"
[direction.mounts.values]
en-US = "Knowledge mounts attach files, directories, repositories, structured data, remote snapshots, and other KERO sets to one project."
ja-JP = "知識マウントは、ファイル、ディレクトリ、リポジトリ、構造化データ、リモートスナップショット、他の KERO セットを一つのプロジェクトに接続します。"
[direction.provenance.values]
en-US = "Claims remain attributable to exact source revisions and regions; disagreement is preserved instead of overwritten."
ja-JP = "主張は正確な情報源のリビジョンと領域まで追跡でき、不一致は上書きされず保持されます。"
[direction.machine_first.values]
en-US = "Human-readable sources compile into semantic IR and deterministic machine-oriented representations."
ja-JP = "人間が読める情報源を、セマンティック IR と決定論的な機械向け表現にコンパイルします。"
[direction.project_state.values]
en-US = "CLI, IDE, and future GUI adapters share one project, mount, compiler, status, query, and projection model."
ja-JP = "CLI、IDE、将来の GUI アダプターは、一つのプロジェクト、マウント、コンパイラー、状態、クエリ、投影モデルを共有します。"

[architecture.heading.values]
en-US = "Architecture"
ja-JP = "アーキテクチャ"
[architecture.pipeline_intro.values]
en-US = "KERO separates project-facing mounts, provenance-facing sources, meaning-facing semantic IR, determinism-facing canonicalization, and storage-facing encoding."
ja-JP = "KERO は、プロジェクト向けマウント、来歴向け情報源、意味向けセマンティック IR、決定性向け正規化、保存向けエンコーディングを分離します。"
[architecture.boundary.values]
en-US = "Canonical knowledge preserves explicit and derived origins. Indexes, summaries, embeddings, caches, and context projections are removable derived artifacts."
ja-JP = "正規知識は明示的および派生した起源を保持します。インデックス、要約、埋め込み、キャッシュ、コンテキスト投影は削除可能な派生成果物です。"

[status.heading.values]
en-US = "Status"
ja-JP = "状態"
[status.pre_alpha.values]
en-US = "KERO is pre-alpha. Its project, compilation, query, trace, and bounded-context interfaces are evolving before 1.0."
ja-JP = "KERO はプレアルファです。プロジェクト、コンパイル、クエリ、トレース、限定コンテキストの各インターフェースは 1.0 に向けて進化中です。"
[status.cli.values]
en-US = "The Rust workspace provides a project-attached knowledge CLI. Initialize or open a KERO project, compile explicitly annotated Markdown sources, inspect status, query records, and trace provenance."
ja-JP = "Rust ワークスペースはプロジェクトに接続された知識 CLI を提供します。KERO プロジェクトを初期化または開き、明示的に注釈付けした Markdown ソースをコンパイルし、状態の確認、レコードのクエリ、来歴のトレースを行えます。"

[development.heading.values]
en-US = "Development"
ja-JP = "開発"
[development.validation.values]
en-US = "Canonical development happens in kero-net/source. The source repository generates the public channel branches."
ja-JP = "正規の開発は kero-net/source で行い、ソースリポジトリから公開チャネルブランチを生成します。"

[project.heading.values]
en-US = "Project"
ja-JP = "プロジェクト"
[project.repository_topology.values]
en-US = "kero-net/source contains authored code and construction inputs. Automation projects reviewed commits into canary, beta, and stable branches of kero-net/kero."
ja-JP = "kero-net/source には作成されたコードと構築入力が含まれます。自動化により、レビュー済みコミットを kero-net/kero の canary、beta、stable ブランチへ投影します。"

[navigation.setup.values]
en-US = "Set up"
ja-JP = "セットアップ"

[setup.heading.values]
en-US = "Set up KERO"
ja-JP = "KERO のセットアップ"
[setup.introduction.values]
en-US = "KERO uses Rust and the native build tools for your operating system. Choose the instructions for the shell and system you use."
ja-JP = "KERO は Rust と OS に対応するネイティブビルドツールを使用します。使用する OS とシェルに対応する手順を選んでください。"
[setup.windows_heading.values]
en-US = "Windows"
ja-JP = "Windows"
[setup.windows_intro.values]
en-US = "Install Rust and the native build tools required by the Rust toolchain you choose. This is a local build prerequisite only; KERO behavior and repository configuration are the same across supported systems and CPU architectures."
ja-JP = "Rust と、選択した Rust ツールチェーンに必要なネイティブビルドツールをインストールします。これはローカルビルドの前提条件のみであり、KERO の動作とリポジトリ設定は対応するシステムおよび CPU アーキテクチャ間で共通です。"
[setup.windows_after_install.values]
en-US = "Open a new terminal window after installation, then clone and build:"
ja-JP = "インストール後に新しいターミナルウィンドウを開き、次のコマンドでクローンしてビルドします。"
[setup.macos_heading.values]
en-US = "macOS (Terminal)"
ja-JP = "macOS (ターミナル)"
[setup.macos_intro.values]
en-US = "Install the Xcode Command Line Tools, then install Rust in Terminal."
ja-JP = "Xcode Command Line Tools をインストールしてから、ターミナルで Rust をインストールします。"
[setup.linux_heading.values]
en-US = "Linux (Bash or a compatible shell)"
ja-JP = "Linux (Bash または互換シェル)"
[setup.linux_intro.values]
en-US = "Install your distribution's C/C++ build tools and curl, then install Rust."
ja-JP = "ディストリビューションの C/C++ ビルドツールと curl をインストールしてから、Rust をインストールします。"
[setup.debian_heading.values]
en-US = "Ubuntu or Debian"
ja-JP = "Ubuntu または Debian"
[setup.fedora_heading.values]
en-US = "Fedora"
ja-JP = "Fedora"
[setup.arch_heading.values]
en-US = "Arch Linux"
ja-JP = "Arch Linux"
[setup.unix_build_intro.values]
en-US = "Install Rust on macOS or Linux, then clone and build:"
ja-JP = "macOS または Linux では Rust をインストールしてから、次のコマンドでクローンしてビルドします。"
[setup.note.values]
en-US = "The commands above are shared template content rather than translations, so every locale receives the same reviewed setup instructions."
ja-JP = "上記のコマンドは翻訳ではなく共有テンプレートの内容です。すべてのロケールで同じレビュー済みのセットアップ手順を提供します。"

