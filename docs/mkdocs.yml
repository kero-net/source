site_name: SCOPE
site_description: Authorization, artifact verification, and Linux enforcement documentation.
site_url: https://kooraseru.github.io/SCOPE/
docs_dir: ../../.heap/source/staging/documentation
site_dir: ../../.heap/source/preview/documentation
use_directory_urls: true
strict: true
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    scheme: slate
    primary: black
    accent: cyan
  language: en
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
extra_javascript:
  - assets/javascripts/localization.js
extra:
  generator: false
  alternate: []
