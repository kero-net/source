[package]
name = "kero-core"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Core library for KERO's project-attached knowledge system"
license = "ISC"
repository = "https://github.com/kero-net/kero"
keywords = ["knowledge", "provenance", "semantic", "retrieval"]
categories = ["data-structures", "development-tools"]

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = "1.1"

[dev-dependencies]
tempfile = "3"
